<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Calistenia" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>Treino Calistenia 4 Semanas</title>
  <link rel="stylesheet" href="style/styles.css?v=4" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" sizes="192x192" href="img/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="img/icons/icon-192.png" />
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="header-top">
        <h1>Treino Calistenia</h1>
        <div class="user-switch">
          <button id="btn-emerson" class="user-btn active" data-user="emerson">Emerson</button>
          <button id="btn-esposa" class="user-btn" data-user="esposa">Joselene</button>
        </div>
      </div>
      <div class="progress-overview">
        <div class="progress-bar-bg">
          <div id="overall-progress" class="progress-bar-fill"></div>
        </div>
        <span id="progress-text">0% concluído</span>
      </div>
    </header>

    <nav class="levels-nav" id="levels-nav"></nav>
    <nav class="weeks-nav" id="weeks-nav"></nav>

    <main id="main-content">
      <div class="welcome">
        <p>Selecione uma semana acima para começar.</p>
        <p class="hint">Seu progresso é salvo automaticamente neste dispositivo.</p>
      </div>
    </main>

    <footer class="footer">
      <button id="btn-reset" class="btn-secondary">Zerar progresso deste usuário</button>
      <p class="footer-note">Dados salvos apenas neste navegador (localStorage)</p>
    </footer>
  </div>

  <div id="video-modal" class="modal hidden">
    <div class="modal-content">
      <button class="modal-close" id="modal-close">&times;</button>
      <div id="video-container"></div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="js/data.js?v=4"></script>
  <script src="js/app.js?v=4"></script>
  <script>
    if ("serviceWorker" in navigator) {
      let refreshing = false;
      navigator.serviceWorker.addEventListener("controllerchange", () => {
        if (refreshing) return;
        refreshing = true;
        window.location.reload();
      });
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js?v=3").catch(() => {});
      });
    }
  </script>
</body>
</html>
